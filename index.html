<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Se vende</title>
<style>
  :root{
    --pink:#FBC7D4;
    --pink-dark:#F49BB4;
    --blue:#BEE3F8;
    --blue-dark:#8FCDEF;
    --mint:#CDEFE0;
    --yellow:#FFF0B8;
    --accent:#F49BB4;
    --accent-dark:#E17FA0;
    --bg:#FFF9F4;
    --card-bg:#FFFFFF;
    --text:#4A4038;
    --muted:#96897E;
    --border:#F3E6DD;
    --radius:22px;
    --shadow:0 6px 18px rgba(244,155,180,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(circle at 8% 12%, rgba(190,227,248,0.5) 0, transparent 40%),
      radial-gradient(circle at 92% 18%, rgba(255,240,184,0.55) 0, transparent 38%),
      radial-gradient(circle at 15% 92%, rgba(205,239,224,0.55) 0, transparent 40%),
      var(--bg);
    color:var(--text);
    padding-bottom:104px;
  }
  header{
    background:linear-gradient(135deg, var(--blue) 0%, var(--pink) 100%);
    color:#5A4A42;
    padding:34px 20px 44px;
    text-align:center;
    border-bottom-left-radius:32px;
    border-bottom-right-radius:32px;
    position:relative;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(244,155,180,0.25);
  }
  header::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.55) 2.5px, transparent 2.5px);
    background-size:26px 26px;
    opacity:.6;
  }
  header .decor{
    position:relative;
    font-size:1.4rem;
    letter-spacing:6px;
    opacity:.9;
    margin-bottom:2px;
  }
  header h1{
    position:relative;
    margin:2px 0 8px;
    font-size:1.9rem;
    letter-spacing:.2px;
    font-weight:800;
  }
  header p{
    position:relative;
    margin:0;
    opacity:.85;
    font-size:.95rem;
  }
  main{
    max-width:1100px;
    margin:0 auto;
    padding:26px 16px 20px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:20px;
  }
  .card{
    background:var(--card-bg);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    border:2.5px solid transparent;
    transition:.18s ease;
    display:flex;
    flex-direction:column;
  }
  .card:hover{ transform:translateY(-2px); }
  .card.selected{
    border-color:var(--accent);
    box-shadow:0 10px 24px rgba(244,155,180,0.35);
  }
  .card .imgwrap{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:linear-gradient(135deg,#FDF3E7,#F3F7FB);
    overflow:hidden;
  }
  .card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .badge-selected{
    position:absolute;
    top:10px;
    right:10px;
    background:var(--accent);
    color:#fff;
    width:30px;
    height:30px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .card.selected .badge-selected{display:flex;}
  .card.sold{
    opacity:.72;
  }
  .card.sold .imgwrap{filter:grayscale(35%);}
  .badge-sold{
    position:absolute;
    top:16px;
    left:-38px;
    width:150px;
    transform:rotate(-38deg);
    background:linear-gradient(135deg,#E17FA0,#C75A80);
    color:#fff;
    text-align:center;
    font-weight:800;
    font-size:.78rem;
    letter-spacing:1px;
    padding:5px 0;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
    z-index:3;
    pointer-events:none;
  }
  .select-btn:disabled{
    border-color:var(--border);
    background:#F3EDE8;
    color:var(--muted);
    cursor:not-allowed;
  }
  .zoom-btn{
    position:absolute;
    bottom:8px;
    left:8px;
    width:34px;
    height:34px;
    border-radius:50%;
    background:rgba(255,255,255,0.85);
    color:#5A4A42;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:15px;
    z-index:2;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    transition:.15s ease;
  }
  .zoom-btn:hover{background:#fff;}
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(74,64,56,0.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:60px 24px 24px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:16px;
  }
  .lightbox-caption{
    position:absolute;
    left:0;right:0;
    bottom:18px;
    text-align:center;
    color:#fff;
    font-size:.9rem;
    opacity:.9;
  }
  .lightbox-close{
    position:absolute;
    top:18px;
    left:18px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,0.16);
    color:#fff;
    border:1.5px solid rgba(255,255,255,0.45);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .lightbox-close:hover{background:rgba(255,255,255,0.3);}
  .card-body{
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
  }
  .card-body h3{
    margin:0;
    font-size:1rem;
    line-height:1.3;
    font-weight:700;
    color:#5A4A42;
  }
  .card-body p{
    margin:0;
    font-size:.83rem;
    color:var(--muted);
    line-height:1.4;
    flex:1;
  }
  .row-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
    gap:8px;
  }
  .price{
    font-weight:800;
    font-size:1.02rem;
    color:#fff;
    background:linear-gradient(135deg, var(--accent), var(--accent-dark));
    padding:5px 12px;
    border-radius:999px;
    box-shadow:0 2px 8px rgba(244,155,180,0.4);
  }
  .select-btn{
    border:1.5px solid var(--accent);
    background:#fff;
    color:var(--accent-dark);
    font-weight:700;
    font-size:.82rem;
    padding:7px 13px;
    border-radius:999px;
    cursor:pointer;
    transition:.15s ease;
    white-space:nowrap;
  }
  .select-btn:hover{background:#FFF1F5;}
  .card.selected .select-btn{
    background:var(--accent);
    color:#fff;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    padding:40px 10px;
    font-size:.9rem;
  }
  .cartbar{
    position:fixed;
    left:0;right:0;bottom:0;
    background:#fff;
    border-top:2px solid var(--border);
    border-top-left-radius:22px;
    border-top-right-radius:22px;
    box-shadow:0 -6px 20px rgba(244,155,180,0.18);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    z-index:30;
  }
  .cartbar .info{
    font-size:.88rem;
    color:var(--text);
  }
  .cartbar .info strong{
    color:var(--accent-dark);
  }
  .cartbar .actions{
    display:flex;
    gap:10px;
  }
  .btn{
    border:none;
    border-radius:999px;
    padding:12px 20px;
    font-weight:800;
    font-size:.88rem;
    cursor:pointer;
    transition:.15s ease;
  }
  .btn-primary{
    background:#25D366;
    color:#fff;
    box-shadow:0 4px 12px rgba(37,211,102,0.35);
  }
  .btn-primary:hover{background:#1EBE5A;}
  .btn-primary:disabled{
    background:#DCD4CD;
    box-shadow:none;
    cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    text-decoration:underline;
    padding:12px 6px;
  }
  @media (max-width:480px){
    .cartbar{flex-direction:column;align-items:stretch;}
    .cartbar .actions{justify-content:space-between;}
  }
</style>
</head>

<header>
  <div class="decor">&#9925; &#127882; &#9925;</div>
  <h1>&#127868; Se vende</h1>
  <p>Selecciona lo que te interese y envíalo por WhatsApp</p>
</header>

<main id="main"></main>

<div class="cartbar">

  <div class="actions">
    <button class="btn btn-ghost" id="clearBtn">Vaciar selección</button>
    <button class="btn btn-primary" id="sendBtn" disabled>Enviar por WhatsApp</button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&#10005;</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

const WHATSAPP_NUMBER = "51997213945";

const SOLD_IDS = new Set(PRODUCTS.filter(p=>p.sold).map(p=>p.id));

let selected = new Set();
try{
  const saved = JSON.parse(localStorage.getItem('tienda_selected') || '[]');
  selected = new Set(saved.filter(id => !SOLD_IDS.has(id)));
}catch(e){}

function saveSelection(){
  try{ localStorage.setItem('tienda_selected', JSON.stringify([...selected])); }catch(e){}
}

function fmt(n){ return '€' + n; }

function renderGrid(){
  const main = document.getElementById('main');
  main.innerHTML = '';

  if(PRODUCTS.length === 0){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'No hay artículos disponibles.';
    main.appendChild(e);
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'grid';
  PRODUCTS.forEach(p=>{
    grid.appendChild(renderCard(p));
  });
  main.appendChild(grid);
}

function renderCard(p){
  const card = document.createElement('div');
  card.className = 'card' + (selected.has(p.id) ? ' selected' : '') + (p.sold ? ' sold' : '');
  card.innerHTML = `
    <div class="imgwrap">
      ${p.sold ? '<div class="badge-sold">VENDIDO</div>' : ''}
      <img src="${p.img}" alt="${p.name}" loading="lazy">
      <button class="zoom-btn" title="Ver foto grande">&#128269;</button>
      <div class="badge-selected">&#10003;</div>
    </div>
    <div class="card-body">
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <div class="row-bottom">
        <span class="price">${fmt(p.price)}</span>
        <button class="select-btn" ${p.sold ? 'disabled' : ''}>${p.sold ? 'Vendido' : (selected.has(p.id) ? 'Seleccionado' : 'Seleccionar')}</button>
      </div>
    </div>
  `;
  if(p.sold){
    // Artículo vendido: no se puede seleccionar ni abrir el zoom sobre la imagen.
    card.querySelector('.zoom-btn').onclick = (e)=>{
      e.stopPropagation();
      openLightbox(p.img, p.name);
    };
    return card;
  }
  const toggle = ()=>{
    if(selected.has(p.id)) selected.delete(p.id); else selected.add(p.id);
    saveSelection();
    renderGrid();
    renderCart();
  };
  card.querySelector('.select-btn').onclick = toggle;
  card.querySelector('.imgwrap').onclick = toggle;
  card.querySelector('.zoom-btn').onclick = (e)=>{
    e.stopPropagation();
    openLightbox(p.img, p.name);
  };
  return card;
}

function openLightbox(src, caption){
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxImg').alt = caption;
  document.getElementById('lightboxCaption').textContent = caption;
  lb.classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightboxImg').src = '';
}
document.getElementById('lightboxClose').onclick = closeLightbox;
document.getElementById('lightbox').addEventListener('click', (e)=>{
  if(e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeLightbox();
});

function renderCart(){
  const items = PRODUCTS.filter(p=>selected.has(p.id));
  document.getElementById('count').textContent = items.length;
  document.getElementById('total').textContent = fmt(items.reduce((s,p)=>s+p.price,0));
  document.getElementById('sendBtn').disabled = items.length===0;
}

document.getElementById('clearBtn').onclick = ()=>{
  selected.clear();
  saveSelection();
  renderGrid();
  renderCart();
};

document.getElementById('sendBtn').onclick = ()=>{
  const items = PRODUCTS.filter(p=>selected.has(p.id));
  if(items.length===0) return;
  let lines = [];
  lines.push('¡Hola! Me interesan estos artículos:');
  lines.push('');
  items.forEach(p=>{
    lines.push('- ' + p.name + ': ' + fmt(p.price));
  });
  lines.push('');
  lines.push('Total (' + items.length + ' artículos): ' + fmt(items.reduce((s,p)=>s+p.price,0)));

  const message = lines.join('\n');
  const url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(message);
  window.open(url, '_blank');
};

renderGrid();
